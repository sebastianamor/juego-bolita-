<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bubble Shooter - Match 3 (Física Real)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #0a0a2a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        canvas {
            background: #111;
            border: 3px solid #fff;
            border-radius: 10px;
            cursor: crosshair;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <canvas id="game" width="400" height="500"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        
        const cols = 8;
        const rows = 10;
        const r = 23; 
        const offsetX = 15; 
        const offsetY = 15; 
        
        let grid = []; 
        const colors = ['red', 'blue', 'green', 'yellow', 'purple', 'cyan'];

        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;
        let isShooting = false;
        let projectile = null;
        
        let currentColor = getRandomColor();
        let nextColor = getRandomColor();
        let score = 0;

        function getRandomColor() {
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function init() {
            grid = [];
            for (let y = 0; y < rows; y++) {
                let row = [];
                for (let x = 0; x < cols; x++) {
                    if (y < 4) {
                        row.push({ x: x, y: y, color: getRandomColor() });
                    } else {
                        row.push(null);
                    }
                }
                grid.push(row);
            }
        }

        function getPixelPos(gridX, gridY) {
            return {
                x: gridX * (r * 2) + r + offsetX,
                y: gridY * (r * 2) + r + offsetY
            };
        }

        function getGridPos(pixelX, pixelY) {
            return {
                x: Math.round((pixelX - r - offsetX) / (r * 2)),
                y: Math.round((pixelY - r - offsetY) / (r * 2))
            };
        }

        function drawBubble(x, y, color) {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x - 5, y - 5, r / 3, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
            ctx.fill();
            ctx.strokeStyle = "rgba(0,0,0,0.3)";
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    let b = grid[y][x];
                    if (b) {
                        let pos = getPixelPos(x, y);
                        drawBubble(pos.x, pos.y, b.color);
                    }
                }
            }

            // Cañón
            ctx.fillStyle = "#444";
            ctx.fillRect(canvas.width/2 - 25, canvas.height - 50, 50, 50);
            ctx.fillStyle = "#666";
            ctx.beginPath();
            ctx.arc(canvas.width/2, canvas.height - 50, 20, 0, Math.PI * 2);
            ctx.fill();

            if (!projectile) {
                drawBubble(canvas.width/2, canvas.height - 50, currentColor);
            }

            if (!isShooting) {
                ctx.beginPath();
                ctx.moveTo(canvas.width/2, canvas.height - 50);
                ctx.lineTo(mouseX, mouseY);
                ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            if (projectile) {
                drawBubble(projectile.x, projectile.y, projectile.color);
            }

            ctx.fillStyle = "white";
            ctx.font = "bold 16px Arial";
            ctx.fillText("Puntos: " + score, 20, 30);
            
            ctx.font = "12px Arial";
            ctx.fillText("Siguiente:", canvas.width - 80, 30);
            drawBubble(canvas.width - 30, 45, nextColor);
        }

        function update() {
            if (projectile) {
                projectile.x += projectile.dx;
                projectile.y += projectile.dy;

                if (projectile.x - r < 0 || projectile.x + r > canvas.width) {
                    projectile.dx *= -1;
                }

                if (projectile.y - r < 0) {
                    handleCollision();
                }

                if (projectile) {
                    for (let y = 0; y < rows; y++) {
                        for (let x = 0; x < cols; x++) {
                            let b = grid[y][x];
                            if (b) {
                                let pos = getPixelPos(x, y);
                                let dist = Math.hypot(projectile.x - pos.x, projectile.y - pos.y);
                                if (dist < r * 2 - 5) {
                                    handleCollision();
                                    break; 
                                }
                            }
                        }
                        if (!projectile) break;
                    }
                }
            }

            draw();
            requestAnimationFrame(update);
        }

        function handleCollision() {
            let pColor = projectile.color;
            let pX = projectile.x;
            let pY = projectile.y;

            let gridPos = getGridPos(pX, pY);
            let gx = Math.max(0, Math.min(cols - 1, gridPos.x));
            let gy = Math.max(0, Math.min(rows - 1, gridPos.y));

            // Buscar hueco libre
            let found = false;
            if (grid[gy][gx] === null) {
                found = true;
            } else {
                let neighbors = [[0,1],[1,0],[-1,0],[0,-1]];
                for (let n of neighbors) {
                    let ny = gy + n[1];
                    let nx = gx + n[0];
                    if (ny >= 0 && ny < rows && nx >= 0 && nx < cols && grid[ny][nx] === null) {
                        gx = nx;
                        gy = ny;
                        found = true;
                        break;
                    }
                }
            }

            if (found) {
                grid[gy][gx] = { x: gx, y: gy, color: pColor };
                checkMatches(gx, gy);
            }

            // Reiniciar disparo
            projectile = null;
            isShooting = false;
            currentColor = nextColor;
            nextColor = getRandomColor();
        }

        function checkMatches(startX, startY) {
            let targetColor = grid[startY][startX].color;
            let matches = [];
            let visited = new Set();
            let queue = [{x: startX, y: startY}];

            while (queue.length > 0) {
                let curr = queue.shift();
                let key = `${curr.x},${curr.y}`;
                
                if (visited.has(key)) continue;
                visited.add(key);

                if (curr.y >= 0 && curr.y < rows && curr.x >= 0 && curr.x < cols) {
                    let b = grid[curr.y][curr.x];
                    if (b && b.color === targetColor) {
                        matches.push({x: curr.x, y: curr.y});
                        queue.push({x: curr.x + 1, y: curr.y});
                        queue.push({x: curr.x - 1, y: curr.y});
                        queue.push({x: curr.x, y: curr.y + 1});
                        queue.push({x: curr.x, y: curr.y - 1});
                    }
                }
            }

            if (matches.length >= 3) {
                // 1. Explotar las bolas del mismo color
                for (let m of matches) {
                    grid[m.y][m.x] = null;
                }
                score += matches.length * 10;

                // 2. Aplicar gravedad real (solo caen las que no están conectadas al techo)
                applyRealGravity();
            }
        }

        // NUEVA FUNCIÓN DE GRAVEDAD
        function applyRealGravity() {
            let connectedToTop = new Set();
            let queue = [];

            // 1. Encontrar todas las bolas conectadas al techo (fila 0)
            for (let x = 0; x < cols; x++) {
                if (grid[0][x] !== null) {
                    queue.push({x: x, y: 0});
                    connectedToTop.add(`0,${x}`);
                }
            }

            // Búsqueda en anchura para encontrar todas las conectadas
            while (queue.length > 0) {
                let curr = queue.shift();
                let neighbors = [[0,1],[1,0],[-1,0],[0,-1]];
                
                for (let n of neighbors) {
                    let nx = curr.x + n[0];
                    let ny = curr.y + n[1];
                    let key = `${ny},${nx}`;
                    
                    if (ny >= 0 && ny < rows && nx >= 0 && nx < cols && !connectedToTop.has(key)) {
                        if (grid[ny][nx] !== null) {
                            connectedToTop.add(key);
                            queue.push({x: nx, y: ny});
                        }
                    }
                }
            }

            // 2. Las bolas que NO están en el set "connectedToTop" caen
            for (let x = 0; x < cols; x++) {
                // Recolectar bolas flotantes en esta columna
                let floating = [];
                for (let y = 0; y < rows; y++) {
                    if (grid[y][x] !== null && !connectedToTop.has(`${y},${x}`)) {
                        floating.push(grid[y][x]);
                        grid[y][x] = null;
                    }
                }
                
                // Bajar las bolas flotantes al fondo de la columna
                // (En un juego real, se animarían cayendo, pero aquí las teletransportamos al fondo)
                let bottomY = rows - 1;
                for (let i = floating.length - 1; i >= 0; i--) {
                    while (bottomY >= 0 && grid[bottomY][x] !== null) {
                        bottomY--;
                    }
                    if (bottomY >= 0) {
                        grid[bottomY][x] = floating[i];
                        bottomY--;
                    }
                }
            }
        }

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        canvas.addEventListener('click', () => {
            if (!isShooting) {
                isShooting = true;
                let angle = Math.atan2(mouseY - (canvas.height - 50), mouseX - (canvas.width / 2));
                if (angle > 0) angle = Math.PI - angle; 

                let speed = 12;
                
                projectile = {
                    x: canvas.width / 2,
                    y: canvas.height - 50,
                    dx: Math.cos(angle) * speed,
                    dy: Math.sin(angle) * speed,
                    color: currentColor
                };
            }
        });

        init();
        update();
    </script>
</body>
</html>
